# Reasoning: MiniMax-M2.5 is thinking-only on every host that serves it, so there is no toggle,
#   effort, or reasoning-budget field a caller can set (confirmed on alibaba-token-plan,
#   amazon-bedrock, and auriko). Empty means no caller control, not untested.
base_model = "minimax/MiniMax-M2.5"

reasoning_options = []

[limit]
context = 200000

[cost]
input = 0.3
output = 1.2
cache_read = 0.03
