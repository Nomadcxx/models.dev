# Source: https://commandcode.ai/docs/provider (accessed 2026-10-21)
# Model catalog + pricing: https://commandcode.ai/models and
# https://api.commandcode.ai/provider/v1/models
# Reasoning: always on; no caller control on this host. Live /chat/completions (2026-10-21):
#   plain HTTP 200 with reasoning returned in reasoning and reasoning_details (array);
#   reasoning_effort = off -> HTTP 400 unsupported_value ("Only models that can turn thinking off accept it");
#   none/minimal -> HTTP 400 invalid option (accepted: off|low|medium|high|xhigh|max).
#   low/high/max, thinking.type=disabled, reasoning.enabled=false and
#   chat_template_kwargs.enable_thinking=false -> HTTP 200, reasoning still returned.
#   Repeated trials (n=3-5, easy and hard prompts): reasoning tokens low {5-85} / high {5-68} /
#   max {43-94} - ranges overlap at every level; no level or switch changes the reasoning output.
#   Command Code harness reports "Reasoning effort not supported for MiMo V2.6 Pro." (2026-10-21).
# Interleaved: reasoning_details - this API returns the reasoning in reasoning/reasoning_details
#   (see the live note above), so reasoning_details is the side channel on this API. The opencode
#   tool round-trip (read main.go, follow-up turn, no schema error) confirms replay works, but a
#   passing round-trip does not establish which key carried the reasoning; an earlier attempt with
#   reasoning_details broke the opencode round-trip ("Invalid input: expected array, received
#   string"), so replay with this field is not verified yet.
# Tool call live 2026-10-21: HTTP 200, finish_reason=tool_calls, arguments parse as JSON.
# Streaming live 2026-10-21: stream completes with data: [DONE].
# Modalities inherited from base_model (images/audio/video); host publishes no per-model modality list.
schema = 2
base_model = "xiaomi/mimo-v2.6-pro"

[capabilities]
reasoning = { supported = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_details" }

[cost.text.input]
price = 0.435
cache = { read = 0.0036 }

[cost.text.output]
price = 0.87
