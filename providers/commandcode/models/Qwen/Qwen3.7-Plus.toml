# Source: https://commandcode.ai/docs/provider (accessed 2026-10-14)
# Model catalog + pricing: https://commandcode.ai/models and
# https://api.commandcode.ai/provider/v1/models
# Relay reasoning baseline: providers/alibaba/models/qwen3.8-max.toml
# Toggle: enable_thinking = true|false
# Budget: thinking_budget (reasoning tokens); effort: reasoning_effort when listed.
base_model = "alibaba/qwen3.7-plus"

reasoning_options = [{ type = "toggle" }, { type = "budget_tokens" }]

[cost]
input = 0.4
output = 1.6
cache_read = 0.08
cache_write = 0.5

[[cost.tiers]]
tier = { type = "context", size = 256000 }
input = 1.2
output = 4.8
cache_read = 0.24
cache_write = 1.5
