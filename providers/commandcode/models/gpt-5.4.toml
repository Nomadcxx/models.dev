# Source: https://commandcode.ai/docs/provider (accessed 2026-10-14)
# Model catalog + pricing: https://commandcode.ai/models and
# https://api.commandcode.ai/provider/v1/models
base_model = "openai/gpt-5.4"

base_model_omit = ["limit.input"]

reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh"] }]

[limit]
context = 400000

[cost]
input = 2.5
output = 15
cache_read = 0.25
cache_write = 0
