# Docs: https://commandcode.ai/docs/provider (accessed 2026-10-14)
# Pricing: https://commandcode.ai/models (accessed 2026-10-14)
# Catalog: https://api.commandcode.ai/provider/v1/models
# Claude requires /messages via per-model @ai-sdk/anthropic overrides;
# other models use /chat/completions on the same base URL.
# DeepSeek time-of-day prices use the published off-peak rate; peak is 2x.
name = "CommandCode"
npm = "@ai-sdk/openai-compatible"
env = ["CMD_API_KEY"]
api = "https://api.commandcode.ai/provider/v1"
doc = "https://commandcode.ai/docs/provider"
